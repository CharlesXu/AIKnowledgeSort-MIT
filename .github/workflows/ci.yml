name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release contract
        run: npm run verify:release

      - name: Run frontend unit tests
        env:
          NODE_OPTIONS: --no-experimental-webstorage
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        run: npm run e2e

  rust:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: app,dmg
            executable: src-tauri/target/release/ai-knowledge-sort
            smoke_prefix: ""
            artifact_name: AIKnowledgeSort-macOS
            artifact_paths: |
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            bundles: deb,appimage
            executable: src-tauri/target/release/ai-knowledge-sort
            smoke_prefix: dbus-run-session -- xvfb-run -a env NO_AT_BRIDGE=1
            artifact_name: AIKnowledgeSort-Linux
            artifact_paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-2022
            bundles: nsis
            executable: src-tauri/target/release/ai-knowledge-sort.exe
            smoke_prefix: ""
            artifact_name: AIKnowledgeSort-Windows
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            xvfb

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Cargo dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust library tests
        if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Run Rust library tests serially
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1 --nocapture

      - name: Build unsigned desktop bundles
        run: npm run tauri build -- --ci --no-sign --bundles ${{ matrix.bundles }}

      - name: Smoke desktop runtime startup
        run: ${{ matrix.smoke_prefix }} node scripts/run-desktop-smoke.mjs ${{ matrix.executable }}

      - name: Upload desktop bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
