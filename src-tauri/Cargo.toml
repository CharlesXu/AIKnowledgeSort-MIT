[package]
name = "ai-knowledge-sort"
version = "0.1.0"
description = "A local source workbench"
authors = ["AIKnowledgeSort contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_knowledge_sort_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
