[package]
name = "ai-knowledge-sort"
version = "0.1.0"
description = "A local source workbench"
authors = ["AIKnowledgeSort contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_knowledge_sort_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
libc = "0.2"
pdf-extract = "0.10.0"
quick-xml = "0.37.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session", "tower"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["limit"] }
trash = "=5.2.6"
unicode-normalization = "0.1.25"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
